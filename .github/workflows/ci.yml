name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx vite build

  rust:
    name: Rust (fmt, clippy, tests)
    # Windows is the shipped target, so lint and test where the code actually runs.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri-build refuses to build unless every externalBin exists. CI never
      # runs these, so empty placeholders are enough — and keep the job fast.
      - name: Stub sidecar binaries
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          for bin in yt-dlp ffmpeg ffprobe; do
            : > "src-tauri/binaries/${bin}-x86_64-pc-windows-msvc.exe"
          done

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
